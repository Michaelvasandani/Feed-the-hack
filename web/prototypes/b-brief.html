<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campaign Board · Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one reading column. The board answers in a sentence first, then each section backs it up. No cards. */
:root {
  --bg: #fbfbfa; --ink: #111113; --ink-2: #6e6e73; --ink-3: #b4b4b9; --line: #e8e8ea;
  --accent: #2f4bff; --warn: #c2410c;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0e10; --ink: #f2f2f3; --ink-2: #8e8e94; --ink-3: #4a4a50; --line: #222226; --accent: #7b8cff; --warn: #fb923c; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0e0e10; --ink: #f2f2f3; --ink-2: #8e8e94; --ink-3: #4a4a50; --line: #222226; --accent: #7b8cff; --warn: #fb923c; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 56px 120px; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); display: grid; gap: 72px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; color: var(--ink-2); }
nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
nav .brand { font-weight: 600; }
nav button { font: 500 13px var(--sans); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; cursor: pointer; }
nav button:hover { border-color: var(--ink-3); }

.lede { display: grid; gap: 20px; }
.lede h1 { font-size: clamp(30px, 5.4vw, 46px); line-height: 1.12; letter-spacing: -.035em; font-weight: 500; margin: 0; text-wrap: balance; }
.lede h1 em { font-style: normal; color: var(--accent); }
.lede h1 .dim { color: var(--ink-3); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.facts div { display: grid; }
.facts b { font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; }

section { display: grid; gap: 20px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.sh h2 { margin: 0; font-size: 15px; font-weight: 600; }

.todo { display: grid; gap: 2px; }
.todo-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; align-items: center; padding: 10px 0; }
.todo-row .kind { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.todo-row .kind.rehire { color: var(--accent); }
.todo-row .kind.nudge { color: var(--warn); }
.todo-row .why { color: var(--ink-2); font-size: 14px; }
.todo-row button { font: 500 13px var(--sans); background: var(--ink); color: var(--bg); border: 0; border-radius: 99px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }

.rank { display: grid; }
.rank-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) 64px; gap: 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rank-row:last-child { border-bottom: 0; }
.rank-row .nm { min-width: 0; }
.rank-row .nm div:first-child { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-row .r { text-align: right; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.lane { position: relative; height: 18px; }
.lane::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line); }
.lane .tick { position: absolute; top: 2px; bottom: 2px; width: 1px; background: var(--ink-3); }
.lane .pt { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--ink); }
.lane .pt.hi { background: var(--accent); }
.lane .pt.none { background: transparent; border: 1.5px solid var(--warn); }
.scale { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) 64px; gap: 16px; }
.scale .ax { position: relative; height: 14px; }
.scale .ax span { position: absolute; transform: translateX(-50%); }

.fmts { display: grid; gap: 14px; }
.fmt { display: grid; grid-template-columns: 110px 1fr 64px; gap: 16px; align-items: center; }
.fmt .bar { height: 2px; background: var(--ink-3); }
.fmt.win .bar { height: 4px; background: var(--accent); }
.fmt.win .lab, .fmt.win .r { color: var(--accent); font-weight: 600; }
.fmt .r { text-align: right; font-family: var(--mono); font-size: 13px; }

.seg { display: flex; gap: 14px; }
.seg button { font: 500 13px var(--sans); background: none; border: 0; padding: 0; color: var(--ink-3); cursor: pointer; }
.seg button.on { color: var(--ink); }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 18px 14px; }
.vid { color: inherit; text-decoration: none; display: grid; gap: 8px; }
.thumb { aspect-ratio: 9/16; max-width: 100%; border-radius: 6px; background: var(--line) center/cover no-repeat; filter: saturate(.85); transition: filter .2s; }
.vid:hover .thumb { filter: none; }
.vid .m { display: grid; gap: 1px; font-size: 13px; line-height: 1.35; }
.vid .m b { font-weight: 500; }
.untag { color: var(--warn); }
.toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (max-width: 560px) {
  .rank-row, .scale { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) 52px; gap: 10px; }
  .todo-row { grid-template-columns: 1fr auto; } .todo-row .kind { grid-column: 1 / -1; }
  .fmt { grid-template-columns: 84px 1fr 52px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script src="sample-board.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtN = (n) => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K" : String(n);
const fmtX = (pct) => pct == null ? "–" : (pct / 100 >= 10 ? Math.round(pct / 100) : (pct / 100).toFixed(1)) + "×";
const fmtDate = (s) => s ? new Date(s.length === 10 ? s + "T00:00" : s).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "–";
const FMT = { unboxing: "Unboxing", grwm: "GRWM", review: "Review", haul: "Haul", tutorial: "Tutorial", gift_guide: "Gift guide", day_in_life: "Day in life", other: "Other", unclassified: "Unclassified" };
let filter = "all";

// Reach spans 0.3× to 185× here, so the lane uses a log scale from 0.1× to 1000×.
const LO = Math.log10(0.1), HI = Math.log10(1000);
const pos = (pct) => Math.min(100, Math.max(0, (Math.log10(Math.max(pct / 100, 0.1)) - LO) / (HI - LO) * 100));
const TICKS = [0.1, 1, 10, 100, 1000];

function render(b) {
  const t = b.totals, win = b.formats.find((f) => f.winner);
  const todo = b.creators.filter((c) => c.recommendation !== "keep");
  const ranked = [...b.creators].sort((a, z) => (z.bestViewsPerFollowerPct || -1) - (a.bestViewsPerFollowerPct || -1));
  const max = Math.max(...b.formats.map((f) => f.avgViewsPerFollowerPct || 0), 1);
  const names = Object.fromEntries(b.creators.flatMap((c) => Object.values(c.handles).map((h) => [h, c.name])));
  const vids = b.videos.filter((v) => filter === "all" || !v.tagged);
  const quiet = t.creatorsTotal - t.creatorsPosted;

  $("#app").innerHTML = `
    <nav><span class="brand">${esc(b.campaign.brandName)} <span class="mono">· ${fmtDate(b.campaign.window.start)} – ${fmtDate(b.campaign.window.end)}</span></span><button type="button">Edit campaign</button></nav>

    <header class="lede">
      <h1>${fmtN(t.views)} views from ${t.creatorsPosted} of ${t.creatorsTotal} creators. ${win ? `<em>${FMT[win.format]}s</em> won.` : ""} <span class="dim">${fmtN(t.untaggedViews)} came from videos that never tagged you.</span></h1>
      <div class="facts">
        <div><span class="mono">Videos</span><b>${t.videos}</b></div>
        <div><span class="mono">Untagged</span><b>${t.untaggedVideos}</b></div>
        <div><span class="mono">Likes</span><b>${fmtN(t.likes)}</b></div>
        <div><span class="mono">Shares</span><b>${fmtN(t.shares)}</b></div>
        <div><span class="mono">Quiet</span><b>${quiet}</b></div>
      </div>
    </header>

    <section>
      <div class="sh"><h2>Do next</h2><span class="mono">${todo.length} creators</span></div>
      <div class="todo">${todo.map((c) => `<div class="todo-row">
        <span class="kind ${c.recommendation}">${c.recommendation}</span>
        <div><div>${esc(c.name)}</div><div class="why">${c.recommendation === "nudge" ? "Hasn't posted yet" : `Best video reached ${fmtX(c.bestViewsPerFollowerPct)} their followers`}</div></div>
        <button type="button" data-act="${c.recommendation}" data-name="${esc(c.name)}">Copy message</button>
      </div>`).join("")}</div>
    </section>

    <section>
      <div class="sh"><h2>Reach by creator</h2><span class="mono">best views ÷ followers</span></div>
      <div class="rank">${ranked.map((c) => `<div class="rank-row">
        <div class="nm"><div>${esc(c.name)}</div><div class="mono">${c.followers ? fmtN(c.followers) + " followers" : "no post"}</div></div>
        <div class="lane">${TICKS.map((x) => `<span class="tick" style="left:${pos(x * 100)}%"></span>`).join("")}
          ${c.bestViewsPerFollowerPct == null ? `<span class="pt none" style="left:0%"></span>` : `<span class="pt ${c.overperformer ? "hi" : ""}" style="left:${pos(c.bestViewsPerFollowerPct)}%"></span>`}</div>
        <div class="r">${c.bestViewsPerFollowerPct == null ? "–" : fmtX(c.bestViewsPerFollowerPct)}</div>
      </div>`).join("")}</div>
      <div class="scale mono"><span></span><div class="ax">${TICKS.map((x) => `<span style="left:${pos(x * 100)}%">${x}×</span>`).join("")}</div><span></span></div>
    </section>

    <section>
      <div class="sh"><h2>Format</h2><span class="mono">avg views ÷ followers</span></div>
      <div class="fmts">${b.formats.map((f) => `<div class="fmt ${f.winner ? "win" : ""}">
        <span class="lab">${FMT[f.format] || f.format} <span class="mono">${f.videos}</span></span>
        <div class="bar" style="width:${Math.max(0.6, (f.avgViewsPerFollowerPct || 0) / max * 100)}%"></div>
        <span class="r">${fmtX(f.avgViewsPerFollowerPct)}</span>
      </div>`).join("")}</div>
    </section>

    <section>
      <div class="sh"><h2>Videos</h2>
        <div class="seg" id="seg">${[["all", `All ${b.videos.length}`], ["untagged", `Untagged ${t.untaggedVideos}`]].map(([k, l]) => `<button type="button" data-f="${k}" class="${filter === k ? "on" : ""}">${l}</button>`).join("")}</div>
      </div>
      <div class="strip">${vids.map((v) => `<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener">
        <div class="thumb" style="background-image:url('${esc(v.thumbnailUrl)}')"></div>
        <div class="m"><b>${esc(names[v.creatorHandle] || "@" + v.creatorHandle)}</b>
          <span class="mono">${fmtN(v.views)} · ${FMT[v.format] || v.format}</span>
          ${v.tagged ? "" : `<span class="mono untag">untagged</span>`}</div>
      </a>`).join("")}</div>
    </section>`;
  $("#seg").onclick = (e) => { const f = e.target.closest("button")?.dataset.f; if (f) { filter = f; render(b); } };
  document.querySelectorAll("[data-act]").forEach((el) => el.onclick = () => act(el.dataset.act, el.dataset.name, b));
}
function act(kind, name, b) {
  const first = name.split(" ")[0], brand = b.campaign.brandName;
  const text = kind === "nudge"
    ? `Hey ${first}! Quick check-in on the ${brand} campaign: we haven't seen a post yet. Anything you need from us to get it live this week?`
    : `Hey ${first}! Your ${brand} video crushed it, way past your follower count. We'd love to book you for the next drop. Interested?`;
  const done = () => { const t = $("#toast"); t.textContent = `Copied message for ${first}`; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 1800); };
  navigator.clipboard ? navigator.clipboard.writeText(text).then(done, done) : done();
}
render(window.BOARD);
</script>
</body>
</html>
