<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campaign Board · Glass</title>
<style>
/* Layout: Apple-style large title, grouped inset lists, translucent sticky bar, system colors. */
:root {
  --bg: #f2f2f7; --group: #ffffff; --fill: rgba(118,118,128,.12); --sep: rgba(60,60,67,.18);
  --label: #000000; --label-2: rgba(60,60,67,.6); --label-3: rgba(60,60,67,.3);
  --tint: #ff2d55; --green: #34c759; --orange: #ff9500; --bar: rgba(242,242,247,.72);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --group: #1c1c1e; --fill: rgba(118,118,128,.24); --sep: rgba(84,84,88,.6);
  --label: #ffffff; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
  --tint: #ff375f; --green: #30d158; --orange: #ff9f0a; --bar: rgba(0,0,0,.72); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --group: #1c1c1e; --fill: rgba(118,118,128,.24); --sep: rgba(84,84,88,.6);
  --label: #ffffff; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
  --tint: #ff375f; --green: #30d158; --orange: #ff9f0a; --bar: rgba(0,0,0,.72); color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--label); font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--sep); }
.bar-in { max-width: 1040px; margin: 0 auto; padding: 10px max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left)); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar-title { font-weight: 600; font-size: 15px; opacity: 0; transition: opacity .2s; }
.scrolled .bar-title { opacity: 1; }
.link { color: var(--tint); background: none; border: 0; font: inherit; font-size: 15px; cursor: pointer; padding: 4px 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 8px max(20px, env(safe-area-inset-right)) 80px max(20px, env(safe-area-inset-left)); display: grid; gap: 32px; }
.large { display: grid; gap: 4px; padding-top: 12px; }
.large h1 { font: 700 34px/1.1 var(--display); letter-spacing: .01em; margin: 0; }
.large p { margin: 0; color: var(--label-2); max-width: 62ch; }

.section { display: grid; gap: 8px; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px; }
.section-h h2 { margin: 0; font: 600 20px/1.2 var(--display); letter-spacing: .01em; }
.foot { padding: 0 16px; font-size: 13px; color: var(--label-2); }
.group { background: var(--group); border-radius: var(--r); overflow: hidden; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile { background: var(--group); border-radius: var(--r); padding: 14px 16px 16px; display: grid; gap: 2px; }
.tile .k { font-size: 13px; color: var(--label-2); display: flex; align-items: center; gap: 6px; }
.tile .k i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tile .v { font: 700 28px/1.15 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile .v small { font-size: 17px; color: var(--label-3); font-weight: 600; }
.tile .s { font-size: 13px; color: var(--label-2); }

.cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; align-items: start; }
.row { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px; padding: 10px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: .5px solid var(--sep); }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: #fff; }
.who { min-width: 0; }
.who .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .d { font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.right { display: flex; align-items: center; gap: 10px; }
.num { font-variant-numeric: tabular-nums; color: var(--label-2); font-size: 15px; text-align: right; }
.pill { font-size: 13px; font-weight: 600; border-radius: 99px; padding: 4px 12px; border: 0; cursor: pointer; font-family: inherit; }
.pill.rehire { background: color-mix(in srgb, var(--tint) 14%, transparent); color: var(--tint); }
.pill.nudge { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.dot.quiet { background: var(--orange); }

.callout { padding: 16px; display: grid; gap: 4px; }
.callout .t { font-size: 13px; color: var(--label-2); }
.callout .h { font: 600 20px/1.25 var(--display); }
.callout .h b { color: var(--tint); }
.fmt { padding: 10px 16px; display: grid; gap: 6px; position: relative; }
.fmt + .fmt::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.fmt .top { display: flex; justify-content: space-between; gap: 8px; }
.fmt .top span:last-child { font-variant-numeric: tabular-nums; color: var(--label-2); }
.track { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.track div { height: 100%; border-radius: 3px; background: var(--label-3); }
.fmt.win .track div { background: var(--tint); }
.fmt.win .top span:last-child { color: var(--tint); font-weight: 600; }

.seg { display: inline-grid; grid-auto-flow: column; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; font: 500 13px var(--sans); color: var(--label); padding: 5px 14px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--group); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
.feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.vid { color: inherit; text-decoration: none; display: grid; gap: 8px; }
.thumb { aspect-ratio: 9/14; max-width: 100%; border-radius: 12px; background: var(--fill) center/cover no-repeat; position: relative; overflow: hidden; transition: transform .25s; }
.vid:hover .thumb { transform: scale(1.02); }
.thumb .views { position: absolute; left: 8px; bottom: 8px; color: #fff; font-weight: 600; font-size: 13px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.thumb .tag { position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 600; color: #fff; background: rgba(0,0,0,.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 99px; padding: 3px 8px; }
.vid .cap { font-size: 13px; line-height: 1.3; }
.vid .cap b { font-weight: 600; display: block; }
.vid .cap span { color: var(--label-2); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; background: var(--group); color: var(--label); box-shadow: 0 8px 30px rgba(0,0,0,.18); border-radius: 99px; padding: 10px 18px; font-size: 14px; font-weight: 500; transition: .25s; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="bar"><div class="bar-in"><button class="link" type="button">‹ Campaigns</button><span class="bar-title" id="bar-title"></span><button class="link" type="button">Edit</button></div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script src="sample-board.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtN = (n) => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K" : String(n);
const fmtX = (pct) => pct == null ? "–" : (pct / 100 >= 10 ? Math.round(pct / 100) : (pct / 100).toFixed(1)) + "×";
const fmtDate = (s) => s ? new Date(s.length === 10 ? s + "T00:00" : s).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "–";
const FMT = { unboxing: "Unboxing", grwm: "GRWM", review: "Review", haul: "Haul", tutorial: "Tutorial", gift_guide: "Gift guide", day_in_life: "Day in life", other: "Other", unclassified: "Unclassified" };
const HUES = ["#ff2d55", "#5856d6", "#007aff", "#34c759", "#ff9500", "#af52de", "#00c7be", "#ff3b30", "#5ac8fa"];
let filter = "all";

function render(b) {
  const t = b.totals, quiet = b.creators.filter((c) => c.status === "quiet");
  const win = b.formats.find((f) => f.winner);
  const max = Math.max(...b.formats.map((f) => f.avgViewsPerFollowerPct || 0), 1);
  const names = Object.fromEntries(b.creators.flatMap((c) => Object.values(c.handles).map((h) => [h, c.name])));
  const vids = b.videos.filter((v) => filter === "all" || !v.tagged);
  $("#bar-title").textContent = b.campaign.brandName;
  $("#app").innerHTML = `
    <header class="large">
      <h1>${esc(b.campaign.brandName)}</h1>
      <p>${fmtDate(b.campaign.window.start)} – ${fmtDate(b.campaign.window.end)} · ${esc(b.campaign.brief)}</p>
    </header>

    <section class="tiles">
      ${tile("Views", fmtN(t.views), `${fmtN(t.likes)} likes`, "var(--tint)")}
      ${tile("Videos", t.videos, `${fmtN(t.comments)} comments`, "#007aff")}
      ${tile("Posted", `${t.creatorsPosted}<small> of ${t.creatorsTotal}</small>`, quiet.length ? `${quiet.length} went quiet` : "Everyone posted", "var(--green)")}
      ${tile("Untagged", t.untaggedVideos, `${fmtN(t.untaggedViews)} views found`, "var(--orange)")}
    </section>

    <div class="cols">
      <section class="section">
        <div class="section-h"><h2>Creators</h2></div>
        <div class="group">${b.creators.map((c, i) => creator(c, i)).join("")}</div>
        <div class="foot">Reach is best video views ÷ followers.</div>
      </section>
      <section class="section">
        <div class="section-h"><h2>Formats</h2></div>
        <div class="group">
          ${win ? `<div class="callout"><span class="t">Brief more of this</span><span class="h"><b>${FMT[win.format]}</b> reached ${fmtX(win.avgViewsPerFollowerPct)} followers on average</span></div>` : ""}
        </div>
        <div class="group">
          ${b.formats.map((f) => `<div class="fmt ${f.winner ? "win" : ""}">
            <div class="top"><span>${FMT[f.format] || f.format} <span style="color:var(--label-2)">· ${f.videos}</span></span><span>${fmtX(f.avgViewsPerFollowerPct)}</span></div>
            <div class="track"><div style="width:${Math.max(1, (f.avgViewsPerFollowerPct || 0) / max * 100)}%"></div></div>
          </div>`).join("")}
        </div>
      </section>
    </div>

    <section class="section">
      <div class="section-h"><h2>Videos</h2>
        <div class="seg" id="seg">${[["all", "All"], ["untagged", "Untagged"]].map(([k, l]) => `<button type="button" data-f="${k}" class="${filter === k ? "on" : ""}">${l}</button>`).join("")}</div>
      </div>
      <div class="feed">${vids.map((v) => `<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener">
        <div class="thumb" style="background-image:url('${esc(v.thumbnailUrl)}')">
          ${v.tagged ? "" : `<span class="tag">Untagged</span>`}
          <span class="views">▶ ${fmtN(v.views)}</span>
        </div>
        <div class="cap"><b>${esc(names[v.creatorHandle] || "@" + v.creatorHandle)}</b><span>${FMT[v.format] || v.format} · ${fmtDate(v.publishedAt)}${v.viewsPerFollowerPct >= 100 ? " · " + fmtX(v.viewsPerFollowerPct) : ""}</span></div>
      </a>`).join("")}</div>
    </section>`;
  $("#seg").onclick = (e) => { if (e.target.dataset.f) { filter = e.target.dataset.f; render(b); } };
  document.querySelectorAll("[data-act]").forEach((el) => el.onclick = () => act(el.dataset.act, el.dataset.name, b));
}
function tile(k, v, s, color) {
  return `<div class="tile"><span class="k"><i style="background:${color}"></i>${k}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
}
function creator(c, i) {
  const h = c.handles.tiktok || c.handles.instagram;
  const btn = c.recommendation === "keep" ? "" : `<button type="button" class="pill ${c.recommendation}" data-act="${c.recommendation}" data-name="${esc(c.name)}">${c.recommendation === "rehire" ? "Rehire" : "Nudge"}</button>`;
  return `<div class="row">
    <div class="av" style="background:${HUES[i % HUES.length]}">${esc(c.name[0])}</div>
    <div class="who"><div class="n">${esc(c.name)}</div><div class="d"><span class="dot ${c.status}" style="display:inline-block;margin-right:6px"></span>${c.status === "posted" ? `${c.videos} video${c.videos === 1 ? "" : "s"} · ${fmtN(c.views)} views` : "No post yet"} · @${esc(h)}</div></div>
    <div class="right"><span class="num">${c.status === "posted" ? fmtX(c.bestViewsPerFollowerPct) : ""}</span>${btn}</div>
  </div>`;
}
function act(kind, name, b) {
  const first = name.split(" ")[0], brand = b.campaign.brandName;
  const text = kind === "nudge"
    ? `Hey ${first}! Quick check-in on the ${brand} campaign: we haven't seen a post yet. Anything you need from us to get it live this week?`
    : `Hey ${first}! Your ${brand} video crushed it, way past your follower count. We'd love to book you for the next drop. Interested?`;
  const done = () => toast(`Message for ${first} copied`);
  navigator.clipboard ? navigator.clipboard.writeText(text).then(done, done) : done();
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 1800); }
addEventListener("scroll", () => document.body.classList.toggle("scrolled", scrollY > 60), { passive: true });
render(window.BOARD);
</script>
</body>
</html>
